name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Lint
        run: python -m ruff check . ../scripts
      - name: Test
        run: python -m pytest -q
      - name: Test with the rule knowledge model (swap check)
        run: python -m pytest -q
        env:
          TEST_LEARNER_KNOWLEDGE: rule
      - name: Evaluation harnesses, smoke mode (E2, E4 gates on any leak, E3, E6)
        run: |
          python ../eval/learner-sim/run.py --smoke --out "$RUNNER_TEMP/e2"
          python ../eval/privacy-audit/run.py --smoke --out "$RUNNER_TEMP/e4"
          python ../eval/personalization/run.py --smoke --out "$RUNNER_TEMP/e3"
          python ../eval/privacy-filter/run.py --smoke --out "$RUNNER_TEMP/e6"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  docker:
    # Builds both images as in production, then checks that the API runs offline with its routing and
    # evidence models and that the demo seed script works inside the container (no Ollama in CI).
    runs-on: ubuntu-latest
    env:
      SPACY_MODEL: en_core_web_sm  # smaller image; production builds en_core_web_lg
    steps:
      - uses: actions/checkout@v4
      - name: Test settings (CI-only values)
        run: |
          cat > .env <<'ENV'
          INSTRUCTOR_USERNAME=prof
          INSTRUCTOR_INITIAL_PASSWORD=ci-initial-password-only
          CONTENT__SERVE_UNREVIEWED=true
          OLLAMA_URL=http://127.0.0.1:9
          ENV
      - name: Build
        run: docker compose build
      - name: Start
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health through the web proxy
        run: |
          curl -fsS http://localhost:8080/api/v1/health | tee health.json
          grep -q '"routing_impl":"semantic"' health.json
      - name: Models are in the image (offline)
        run: docker compose exec -T api python -m app.routing.prepare --check
      - name: Demo seed script
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' http://localhost:8080/api/v1/auth/login \
            -d '{"username":"prof","password":"ci-initial-password-only"}' > /dev/null
          curl -fsS -b jar -H 'Content-Type: application/json' http://localhost:8080/api/v1/auth/change-password \
            -d '{"current_password":"ci-initial-password-only","new_password":"ci-changed-password-only"}' > /dev/null
          docker compose exec -T -e DEMO_INSTRUCTOR_PASSWORD=ci-changed-password-only api \
            python /app/scripts/demo_seed.py --base-url http://127.0.0.1:8000 | tee seed.txt
          grep -q "demo.advanced" seed.txt
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
