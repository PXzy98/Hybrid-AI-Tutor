name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m spacy download en_core_web_sm
      - name: Lint
        run: python -m ruff check . ../scripts
      - name: Test
        run: python -m pytest -q
      - name: Test with the rule knowledge model (swap check)
        run: python -m pytest -q
        env:
          TEST_LEARNER_KNOWLEDGE: rule
      - name: Evaluation harnesses, smoke mode (E2, E4 gates on any leak, E3)
        run: |
          python ../eval/learner-sim/run.py --smoke --out "$RUNNER_TEMP/e2"
          python ../eval/privacy-audit/run.py --smoke --out "$RUNNER_TEMP/e4"
          python ../eval/personalization/run.py --smoke --out "$RUNNER_TEMP/e3"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
