name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        # tests and evaluation harnesses create and drop their own databases here (TEST_DATABASE_URL)
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/postgres
      PGPASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # the model comes from GitHub releases, which sometimes answer 504: retry a few times
          for i in 1 2 3 4 5; do python -m spacy download en_core_web_sm && break; [ "$i" = 5 ] && exit 1; sleep 20; done
      - name: Lint
        run: python -m ruff check . ../scripts
      - name: Security scans (task Z13; known findings are listed with their reason, anything new fails)
        run: |
          python -m pip install "bandit==1.9.4" "pip-audit==2.10.1"
          python -m bandit -q -r app -ll -b .bandit-baseline.json
          python -m pip_audit --skip-editable --progress-spinner off             $(sed -e 's/#.*//' -e '/^[[:space:]]*$/d' -e 's/^/--ignore-vuln /' .pip-audit-ignore)
      - name: Migrations upgrade an empty database
        run: |
          psql -h localhost -U postgres -c "CREATE DATABASE migration_check"
          DATABASE_URL=postgresql+psycopg://postgres@localhost:5432/migration_check python -m alembic upgrade head
      - name: Test
        run: python -m pytest -q
      - name: Test with the rule knowledge model (swap check)
        run: python -m pytest -q
        env:
          TEST_LEARNER_KNOWLEDGE: rule
      - name: Evaluation harnesses, smoke mode (E2, E4 gates on any leak, E3, E6)
        run: |
          python ../eval/learner-sim/run.py --smoke --out "$RUNNER_TEMP/e2"
          python ../eval/privacy-audit/run.py --smoke --out "$RUNNER_TEMP/e4"
          python ../eval/personalization/run.py --smoke --out "$RUNNER_TEMP/e3"
          python ../eval/privacy-filter/run.py --smoke --out "$RUNNER_TEMP/e6"
          python ../eval/load-test/run.py --smoke --stream --out "$RUNNER_TEMP/load"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: npm audit (production dependencies; high or critical fails, task Z13)
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (development tools, report only)
        run: npm audit || true

  docker:
    # Builds both images as in production, then checks that the API runs offline with its routing and
    # evidence models and that the demo seed script works inside the container (no Ollama in CI).
    runs-on: ubuntu-latest
    env:
      SPACY_MODEL: en_core_web_sm  # smaller image; production builds en_core_web_lg
    steps:
      - uses: actions/checkout@v4
      - name: Test settings (CI-only values)
        run: |
          cat > .env <<'ENV'
          INSTRUCTOR_USERNAME=prof
          INSTRUCTOR_INITIAL_PASSWORD=ci-initial-password-only
          CONTENT__SEED_STATUS=active
          OLLAMA_URL=http://127.0.0.1:9
          POSTGRES_PASSWORD=ci-only-db-password
          ENV
      - name: Build
        run: docker compose build
      - name: Image scan (Trivy; HIGH and CRITICAL with a fix, report only, task Z13)
        run: |
          for image in $(docker compose config --images | sort -u); do
            echo "::group::$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.0 image               --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 --no-progress --scanners vuln "$image"
            echo "::endgroup::"
          done
      - name: Start
        run: docker compose up -d --wait --wait-timeout 180
      - name: Health through the web proxy
        run: |
          curl -fsS http://localhost:8080/api/v1/health | tee health.json
          grep -q '"routing_impl":"semantic"' health.json
      - name: Worker runs and the database is not published
        run: |
          docker compose exec -T worker python -m app.worker --check
          docker compose -f docker-compose.yml config --format json | python3 -c "import json,sys; d=json.load(sys.stdin); assert 'ports' not in d['services']['db'], 'db must not publish ports'; assert d['networks']['internal']['internal'] is True"
      - name: Models are in the image (offline)
        run: docker compose exec -T api python -m app.routing.prepare --check
      - name: Demo seed script
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' http://localhost:8080/api/v1/auth/login \
            -d '{"username":"prof","password":"ci-initial-password-only"}' > /dev/null
          curl -fsS -b jar -H 'Content-Type: application/json' http://localhost:8080/api/v1/auth/change-password \
            -d '{"current_password":"ci-initial-password-only","new_password":"ci-changed-password-only"}' > /dev/null
          docker compose exec -T -e DEMO_INSTRUCTOR_PASSWORD=ci-changed-password-only api \
            python /app/scripts/demo_seed.py --base-url http://127.0.0.1:8000 | tee seed.txt
          grep -q "demo.advanced" seed.txt
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
