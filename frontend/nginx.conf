# One origin for the browser: the SPA and /api are served from the same host and port, so the httpOnly
# session cookie works without CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API -> FastAPI container. Answers from the local model can take a while, hence the long timeouts.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 1m;
    }

    # hashed build assets can be cached for a long time
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # client-side routes (/chat, /me, ...) all load the SPA
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
    # note: add_header in a location replaces (not extends) the server-level ones, hence the repetition
}
