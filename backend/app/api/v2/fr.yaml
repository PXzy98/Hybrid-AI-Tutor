step_failed: "{step} : n’a pas pu être terminé"

consent: >-
  Pour adapter les explications à vous, le tuteur tient un profil d’apprentissage : une estimation de votre
  maîtrise de chaque partie du sujet, des malentendus courants que vous pourriez avoir, et de la façon dont vous
  préférez les explications (des exemples d’abord ou l’idée générale d’abord, courtes ou détaillées). Il ne
  conserve pas vos questions sous forme lisible avec votre nom. Le profil est stocké seulement sur les serveurs
  du cours et n’est jamais envoyé à des services d’IA externes ; ils peuvent seulement recevoir un niveau
  général comme « de base ». Vous pouvez consulter ou réinitialiser votre profil à tout moment dans « Ma
  progression », et l’enseignant peut supprimer votre compte et ses données. Sans consentement, le tuteur
  répond quand même, mais ne s’adapte pas à vous.

# the privacy profiles' consent notes (app/privacy/profiles/<name>.yaml)
consent_notes:
  ece: >-
    Veuillez retirer les mots de passe, les clés d’API et les adresses réseau du laboratoire du code que vous
    collez ; le tuteur retire aussi ceux qu’il reconnaît avant que quoi que ce soit ne quitte les serveurs du cours.
  computer_science: >-
    Veuillez retirer les mots de passe, les clés d’API et les adresses de serveur du code que vous collez ; le
    tuteur retire aussi ceux qu’il reconnaît avant que quoi que ce soit ne quitte les serveurs du cours.
  medical_science: >-
    Les questions sur votre propre santé reçoivent une réponse du modèle local du cours ; au plus une
    reformulation générale sans vos détails personnels peut aller à un service externe. Le tuteur ne donne pas
    d’avis médical.

preferences:
  sequencing:
    question: "Quand vous apprenez quelque chose de nouveau, qu’est-ce qui vous aide le plus au début ?"
    example_first: "Un exemple concret d’abord"
    concept_first: "L’idée générale d’abord"
  detail:
    question: "Quelle longueur devraient avoir les explications, en général ?"
    concise: "Courtes et directes"
    detailed: "Détaillées, étape par étape"
