[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Privacy-Aware Hybrid AI Tutor: backend (FastAPI step pipeline + local learner model)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "openai>=1.40",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",  # file uploads (admin: course materials)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/**/*.md"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not ollama and not cloud"'
markers = [
    "ollama: needs the Ollama server (run with -m ollama)",
    "cloud: needs a cloud LLM API key (run with -m cloud)",
    "presidio: needs a spaCy model for Presidio (en_core_web_sm in tests)",
]
