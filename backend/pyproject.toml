[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "app"
version = "0.1.0"
description = "Privacy-Aware Hybrid AI Tutor: backend (FastAPI step pipeline + local learner model)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.21",
    "httpx>=0.27",
    "openai>=1.40",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "spacy>=3.7",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",  # file uploads (admin: course materials)
    "pypdf>=5",  # text PDFs uploaded as course material (no OCR)
    "python-docx>=1.1",  # local extraction of Word paragraphs and tables
    "python-pptx>=1.0,<2",  # local extraction of PowerPoint slides, tables and speaker notes
    "psycopg[binary]>=3.2,<4",  # PostgreSQL driver (task Z3)
    "alembic>=1.13,<2",  # schema migrations (backend/alembic/)
    "cryptography>=42",  # encrypted API keys of model connections (task Z6)
    "prometheus-client>=0.20,<1",  # GET /metrics for Prometheus (task Z13)
    "numpy>=1.26",
    "scikit-learn>=1.5,<2",  # training LR/SVM; portable NPZ weights at runtime
    "sentence-transformers>=3,<6",
    "transformers>=4.41,<5",
    "torch>=2.6",  # CPU is sufficient; install the CPU build first if preferred
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/**/*.md"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]  # autogenerated migrations

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # backend/alembic/ holds the migrations, not the package

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = '-m "not ollama and not cloud"'
markers = [
    "ollama: needs the Ollama server (run with -m ollama)",
    "cloud: needs a cloud LLM API key (run with -m cloud)",
    "presidio: needs a spaCy model for Presidio (en_core_web_sm in tests)",
]
