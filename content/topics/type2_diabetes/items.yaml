  kc: T2D.1
  level: basic
  stem: Which statement about insulin is correct?
  options:
    A: Insulin helps glucose move from the blood into cells
    B: Insulin is a hormone produced by the lungs
    C: Insulin cannot affect blood glucose
    D:
      text: Insulin normally keeps glucose out of body cells
      misconception: T2D.MC1
  answer: A
  explanation: Insulin helps blood glucose enter cells where it can be used for energy.
