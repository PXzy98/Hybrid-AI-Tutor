  level: intermediate
  stem: "A person has a family history of type 2 diabetes and low physical activity. Which statement is most appropriate?"
  options:
    A: "Having affected relatives means changes in activity cannot reduce diabetes risk"
    B: "Increasing activity changes the genes inherited from the family"
    C: "If symptoms are absent, the person has no relevant risk factors"
    D: "Regular physical activity may reduce risk even though family history cannot be changed"
  answer: D
  explanation: "Family history is a nonmodifiable risk factor, while physical activity is modifiable and can help reduce type 2 diabetes risk."
