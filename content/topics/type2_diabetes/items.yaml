  stem: "After a meal, blood glucose rises. Which sequence best describes how insulin helps bring it back toward the usual range?"
  options:
    A: "The pancreas releases glucagon, which directly moves glucose from the blood into muscle cells"
    B: "Insulin prevents glucose uptake by muscle and fat cells to keep blood glucose stable"
    C: "The pancreas releases insulin, which helps insulin-responsive cells take up glucose from the blood"
    D: "The pancreas stops releasing insulin so glucose can enter cells without hormonal signalling"
  answer: C
  explanation: "After a meal, a rise in blood glucose stimulates insulin release from pancreatic beta cells. Insulin helps insulin-responsive tissues take up glucose, supporting blood glucose regulation."
