    A: The body has stopped making energy completely
    B: All glucose has disappeared from cells
    C: Too much glucose remains in the bloodstream
    D: The bloodstream contains no water
  answer: C
  explanation: When insulin is insufficient or less effective, blood glucose may remain high.
