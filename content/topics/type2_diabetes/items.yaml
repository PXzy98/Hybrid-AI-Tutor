  kc: T2D.2
  level: advanced
  stem: Which statement about type 2 diabetes is most accurate?
  options:
    A: It always begins in childhood
    B: It involves the body's difficulty using insulin effectively, sometimes with insufficient insulin
      production
    C: It is diagnosed by counting the number of meals eaten
    D: It is always caused by eating one sugary food
  answer: B
  explanation: Type 2 diabetes often involves insulin resistance and reduced ability to maintain normal
    glucose levels.
