    B: A sudden infection of the pancreas
    C:
      text: The body produces no insulin at all
      misconception: T2D.MC2
    D: Cells not responding normally to insulin
  answer: D
  explanation: With insulin resistance, cells do not respond to insulin as effectively.
  reviewed_by: null
