- id: T2D.3-q1
  kc: T2D.3
  level: basic
  stem: Which statement about type 2 diabetes risk is accurate?
  options:
    A: Only one factor can ever affect risk
    B:
      text: Only people with a family history can develop type 2 diabetes
      misconception: T2D.MC3
    C: Family history can increase risk, but diabetes can also occur without it
    D: Everyone has exactly the same risk
  answer: C
  explanation: Family history is one recognized risk factor, though it is not necessary for diabetes to
    develop.
  reviewed_by: null
