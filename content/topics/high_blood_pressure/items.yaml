  kc: HBP.4
  level: intermediate
  stem: "Why do regular blood pressure checks matter even when a person feels fine?"
  options:
    A: "They do not matter as long as the person feels fine"
    B: "Because the check itself lowers blood pressure"
    C: "High blood pressure often has no symptoms but can still cause damage"
    D: {text: "Because headaches always come first and warn the person", misconception: HBP.MC3}
  answer: C
  explanation: "Because the condition is often silent, measuring is the only way to find it early."
  reviewed_by: null
- id: HBP.4-q4
  kc: HBP.4
  level: advanced
  stem: "Which organs can be affected by long-term high blood pressure?"
  options:
    A: "Only the skin"
    B: {text: "Only the heart", misconception: HBP.MC10}
    C: "Only the lungs"
    D: "The heart, brain, kidneys and eyes"
