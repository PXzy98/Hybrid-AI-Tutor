# ---------------------------------------------------------------- HBP.1 What the numbers mean
- id: HBP.1-q1
  kc: HBP.1
  level: basic
  stem: "A blood pressure reading is written as two numbers, one over the other. What does the top number measure?"
  options:
    A: "The amount of blood in the body"
    B: "The number of heartbeats per minute"
    C: "The pressure in the arteries while the heart beats and pumps blood"
    D: "The pressure in the arteries while the heart rests between beats"
  answer: C
  explanation: "The top (systolic) number is the pressure while the heart contracts; the bottom (diastolic) number is the pressure while it rests between beats."
  reviewed_by: null
- id: HBP.1-q2
  kc: HBP.1
  level: basic
  stem: "What does the bottom (diastolic) number of a blood pressure reading measure?"
  options:
    A: "The pressure in the arteries while the heart rests between beats"
    B: "How fast blood flows through the body"
    C: {text: "The pressure while the heart has stopped", misconception: HBP.MC5}
    D: "The pressure inside the veins"
  answer: A
  explanation: "The heart does not stop between beats; it relaxes and refills. The diastolic number is the arterial pressure during that pause."
  reviewed_by: null
- id: HBP.1-q3
  kc: HBP.1
  level: intermediate
  stem: "Why is high blood pressure often called a 'silent' condition?"
  options:
    A: "It can only be measured while a person sleeps"
    B: {text: "It only matters in older adults", misconception: HBP.MC6}
    C: "It often causes no noticeable symptoms"
    D: {text: "It always causes headaches that people tend to ignore", misconception: HBP.MC3}
  answer: C
  explanation: "Many people with high blood pressure feel completely well, so regular measurement is the only way to know."
  reviewed_by: null
- id: HBP.1-q4
  kc: HBP.1
  level: advanced
  stem: "A person's top number is usually in the normal range, but their bottom number is repeatedly raised. Which general statement is most accurate?"
  options:
    A: {text: "It does not matter, because only the top number counts", misconception: HBP.MC4}
    B: "It proves that the blood pressure monitor is broken"
    C: {text: "It means the heart stops for too long between beats", misconception: HBP.MC5}
    D: "A raised bottom number can still be a concern and is worth discussing with a clinician"
  answer: D
  explanation: "Both numbers are used to judge blood pressure; either one can be raised."
  reviewed_by: null

# ------------------------------------------------- HBP.2 Classification and diagnosis
- id: HBP.2-q1
  kc: HBP.2
  level: basic
  stem: "How is high blood pressure usually confirmed?"
  options:
    A: {text: "From whether the person has headaches", misconception: HBP.MC3}
    B: "From a blood test alone"
    C: {text: "From a single reading at one visit", misconception: HBP.MC1}
    D: "From several readings taken on different occasions"
  answer: D
  explanation: "Blood pressure varies, so a diagnosis is based on repeated readings over time, sometimes including home or 24-hour monitoring."
  reviewed_by: null
- id: HBP.2-q2
  kc: HBP.2
  level: basic
  stem: "Which of these helps get an accurate blood pressure reading at home?"
  options:
    A: "Measuring right after climbing stairs or drinking coffee"
    B: "Sitting quietly for a few minutes with the back supported, feet flat and the arm resting at heart level"
    C: "Measuring over thick clothing while talking"
    D: {text: "Measuring only when you feel a headache", misconception: HBP.MC3}
  answer: B
  explanation: "Rest, a supported back and arm, feet flat, the cuff on a bare arm and no talking all help the reading reflect usual blood pressure."
  reviewed_by: null
- id: HBP.2-q3
  kc: HBP.2
  level: intermediate
  stem: "Why might a clinician suggest home or 24-hour (ambulatory) blood pressure monitoring?"
  options:
    A: "To see blood pressure over time and outside the clinic, for example when clinic readings may be higher than usual"
    B: {text: "As a formality, because home readings cannot be trusted", misconception: HBP.MC12}
    C: {text: "Because one clinic reading is always enough to decide", misconception: HBP.MC1}
    D: "To measure cholesterol"
  answer: A
  explanation: "Some people's readings are higher in the clinic than in daily life; readings over time give a fuller picture."
  reviewed_by: null
- id: HBP.2-q4
  kc: HBP.2
  level: advanced
  stem: "Why do clinicians group readings into categories such as 'normal', 'elevated' and 'high'?"
  options:
    A: "Because the cut-offs are the same in every country and never change"
    B: "Because the categories describe how a person feels"
    C: "To guide follow-up and treatment decisions; the exact cut-offs depend on the guideline being followed"
    D: "Because any reading above normal means medicine must be started immediately"
  answer: C
  explanation: "Categories support decisions about checks, lifestyle and treatment. Guidelines differ in their exact numbers, so this course states which guideline it follows."
  reviewed_by: null

# ------------------------------------------------------------ HBP.3 Risk factors
- id: HBP.3-q1
  kc: HBP.3
  level: basic
  stem: "Which of these is a common risk factor for high blood pressure?"
  options:
    A: "Sleeping on the left side"
    B: "Eating fruit every day"
    C: "Drinking water regularly"
    D: "A diet high in salt (sodium)"
  answer: D
  explanation: "A high-salt diet is one of the best-known risk factors; others include low activity, excess weight, heavy alcohol use, age and family history."
  reviewed_by: null
- id: HBP.3-q2
  kc: HBP.3
  level: basic
  stem: "Which statement about age and high blood pressure is correct?"
  options:
    A: {text: "Only people over 60 can have high blood pressure", misconception: HBP.MC6}
    B: "Blood pressure always falls as people get older"
    C: "The risk rises with age, but younger adults can also have high blood pressure"
    D: "Age has nothing to do with blood pressure"
  answer: C
  explanation: "Age is a risk factor, but high blood pressure is not limited to older people."
  reviewed_by: null
- id: HBP.3-q3
  kc: HBP.3
  level: intermediate
  stem: "Which risk factor for high blood pressure cannot be changed by lifestyle?"
  options:
    A: "Alcohol use"
    B: "Salt intake"
    C: "Family history"
    D: "Physical activity"
  answer: C
  explanation: "Family history and age cannot be changed; diet, activity, weight and alcohol can."
  reviewed_by: null
- id: HBP.3-q4
  kc: HBP.3
  level: advanced
  stem: "Why can someone who feels well and is not stressed still have high blood pressure?"
  options:
    A: {text: "Because stress is the only cause, so they must be stressed without knowing it", misconception: HBP.MC7}
    B: "Because long-term factors such as family history, diet and weight also raise blood pressure, and it usually causes no symptoms"
    C: {text: "Because high blood pressure is caused only by old age", misconception: HBP.MC6}
    D: {text: "They cannot: feeling well shows that blood pressure is normal", misconception: HBP.MC3}
  answer: B
  explanation: "High blood pressure has many contributing factors and is often silent, so how a person feels says little about it."
  reviewed_by: null

# ---------------------------------------------------------- HBP.4 Why it matters
- id: HBP.4-q1
  kc: HBP.4
  level: basic
  stem: "Over many years, untreated high blood pressure raises the risk of which problems?"
  options:
    A: "The common cold"
    B: "Sunburn"
    C: {text: "Heart problems only, and nothing else", misconception: HBP.MC10}
    D: "Heart attack, stroke and kidney disease"
  answer: D
  explanation: "High pressure damages blood vessels throughout the body, including those of the heart, brain and kidneys."
  reviewed_by: null
- id: HBP.4-q2
  kc: HBP.4
  level: intermediate
  stem: "How does long-term high blood pressure harm the body?"
  options:
    A: "It thickens the blood within a single day"
    B: "It makes the heart work harder and damages blood vessels over time"
    C: {text: "It affects the heart but no other organ", misconception: HBP.MC10}
    D: {text: "It only harms people who notice symptoms", misconception: HBP.MC3}
  answer: B
  explanation: "The extra pressure strains the heart and gradually damages artery walls, which affects many organs."
  reviewed_by: null
