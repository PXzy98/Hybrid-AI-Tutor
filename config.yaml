# Privacy-Aware Hybrid AI Tutor: runtime configuration (design: docs/System_Design_v3.md §9).
# Secrets and machine-specific URLs live in .env (see .env.example), not here.

pipeline: [privacy_filter, understand, learner_context, analyze_route, retrieve, route, generate, restore, verify, attach_check, record]
post_response: [update_learner]

verify:
  checkers: [grounding, medical_safety, pii_leak, profile_leak]

routing:
  impl: semantic
  threshold: 0.6
  force_local_if_not_cloud_safe: true
  stub_score: 0.0
  show_progress: true
  enabled_methods:
  - lr
  - svm
  default_method: lr
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  model_dir: data/routing/models
  local_files_only: true
  uncertainty_margin: 0.08
  evidence_required_threshold: 0.35
  freshness_required_threshold: 0.35
  ood_similarity_threshold: 0.25
  relevance_model: cross-encoder/ms-marco-MiniLM-L6-v2
  answerability_model: cross-encoder/qnli-electra-base
  relevance_threshold: 0.6
  answerability_threshold: 0.8

rag:
  impl: medical_hybrid                # BM25 + word/char TF-IDF, section-aware retrieval
  k: 4
  materials_dir: data/topics          # instructor uploads (admin dashboard), one folder per topic

privacy:
  spacy_model: en_core_web_lg         # tests use en_core_web_sm
  score_threshold: 0.5                # phone numbers need a context word ("phone", "call"): 0.4 -> 0.75
  entities: [PERSON, EMAIL_ADDRESS, PHONE_NUMBER, STUDENT_ID, GRADE, HEALTH_DETAIL,
             POSTAL_CODE, HEALTH_CARD, ID_NUMBER, DATE_OF_BIRTH, ADDRESS]   # E6 A5; age and sex are kept on purpose (they change medical answers, G1-95)
  local_only_types: [HEALTH_DETAIL]   # any of these -> cloud_safe = false
  health_detail_policy: generalize    # local_only | generalize: hypothetical rewrite for the cloud (approved by the professor, 20 Oct 2026)
  # Beta (E6 v4: cloud exposure 15.8% -> 2.7%): the local model double-checks cloud-bound questions that mention a
  # health topic; recommended on wherever the local model runs (PRIVACY__LLM_CHECK=true). Off here so that
  # tests and CI, which have no local model, are not kept local by the fail-closed check.
  llm_check: false
  # Beta: also keep local any question with a name/number AND a health topic (stricter, costs answer quality)
  local_if_identified_health_topic: false
  allow_list: [Abbas]                 # course staff names, never redacted (titles like Dr./Prof. are ignored)
  log_raw_text: false                 # must stay false

sessions:
  store: database
  history_turns: 6

learner:
  knowledge: bkt                      # bkt | rule. BKT stays the default although E2 favoured rule (G1-100,
                                      # docs/review/BKT_KC_review.md); fit its parameters on real answers
  preference: simple                  # simple | ils (later)
  weak_evidence: false                # off in the MVP; Beta turns it on after E1
  levels: { basic_below: 0.40, advanced_above: 0.70, hysteresis: 0.05 }
  recommender: { ready: 0.70, mastered: 0.90 }
  bkt_defaults: { p_init: 0.20, learn: 0.10, slip: 0.10, guess: 0.25 }
  bkt_by_level: {}                    # e.g. { advanced: { slip: 0.15 } } — tuned in E2 (Step 14)
  weak_likelihood: { given_mastered: 0.30, given_not_mastered: 0.60 }
  rule: { last_n: 5, weak_penalty: 0.05 }
  class_summary_min_group: 5
  instructor_individual_view: false   # individual learning views stay off unless the client requires them

auth:
  session_ttl_hours: 12
  cookie_name: tutor_session
  cookie_secure: false                # true behind HTTPS
  min_password_length: 10
  max_failed_logins: 5
  lockout_minutes: 15

llm:
  local: { model: "qwen3.5:9b", think: false, temperature: 0.2, num_ctx: 8192, max_tokens: 1024, timeout_s: 60 }
  understand: { model: "qwen3.5:9b", think: false, format: json, timeout_s: 5 }
  cloud: { timeout_s: 30, max_tokens: 2000, fallback_to_local: true, history_turns: 0 }   # reasoning tokens count

limits:
  settings:
    poll_seconds: 5              # each process checks the system settings version this often (design 6.5)
    apply_timeout_seconds: 120   # a component change not applied everywhere by then is rolled back
  models:
    max_concurrent: 4            # requests at the same time per model connection (vLLM batches them)
    queue_timeout_seconds: 60    # a request waiting longer for a slot gets "the model is busy"
  accounts:
    allowed_email_domains: [uottawa.ca]  # roster import and activation (demo accounts use demo.invalid)
    invite_code_length: 10
    invite_expiry_days: 120      # a course invitation code expires after this; rotate it to get a new one
    join_attempts_per_hour: 20   # POST /api/v2/auth/join, per client address
    login_failures_per_hour: 30  # failed logins per client address (v1 and v2); then 429 for the hour
    max_roster_rows: 2000
    max_roster_bytes: 1000000
  content:
    max_import_bytes: 5000000    # content ZIP (YAML seed layout) for POST .../content/import
  usage:                         # per student and course; course settings can only lower them
    questions_per_minute: 6
    questions_per_day: 200
    cloud_calls_per_day: 50

content:
  dir: content/topics
  seed_status: draft                  # status of unreviewed seed items; active only for demos

courses:
  default:
    topics: [high_blood_pressure, type2_diabetes, asthma, migraine, pneumonia]
