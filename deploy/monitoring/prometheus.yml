# Prometheus for the tutor (task Z13, part 2). Started with `docker compose --profile monitoring up -d`.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tutor-api           # app/platform/metrics.py; /metrics is not served by the web proxy
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
  - job_name: vllm                # the local model server (outside the stack): put host:port in targets/vllm.yml
    metrics_path: /metrics
    file_sd_configs:
      - files: ["/etc/prometheus/targets/vllm.yml"]
