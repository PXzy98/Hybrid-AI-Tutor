# Privacy-Aware Hybrid AI Tutor: one command to run the app.
#   docker compose up --build            -> http://localhost:8080
# Ollama runs on the GPU server (OLLAMA_URL in .env); it is not part of this file.
# Settings come from .env (see .env.example); SECTION__FIELD variables override config.yaml values,
# e.g. CONTENT__SEED_STATUS=active for a demo (imports the unreviewed demo content as published when the
# database is first created; docs/DATABASE.md).
services:
  db:
    # PostgreSQL (task Z3). The password comes from POSTGRES_PASSWORD in .env; the data lives in db-data.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_DB: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    # reachable from this machine only (a backend or tests run on the host); never from the network
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        SPACY_MODEL: ${SPACY_MODEL:-en_core_web_lg}
    env_file:
      - path: .env
        required: false
    environment:
      # the db service; the password is passed as PGPASSWORD, never inside the URL
      DATABASE_URL: postgresql+psycopg://tutor@db:5432/tutor
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # instructor uploads inside the named volume, whatever .env says
      RAG__MATERIALS_DIR: /app/var/topics
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - tutor-data:/app/var
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  tutor-data:
  db-data:
