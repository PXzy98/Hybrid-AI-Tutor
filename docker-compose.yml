# Privacy-Aware Hybrid AI Tutor: one command to run the whole system (task Z8; guide 4.2).
#   docker compose up --build            -> http://localhost:8080  (local: plain HTTP)
# Production: SITE_ADDRESS=<domain>, HTTP_PORT=80, HTTPS_PORT=443 in .env, then
#   docker compose -f docker-compose.yml up -d --build
# (only this file: docker-compose.override.yml is the local-development extra that exposes the database).
#
# The local model (vLLM or Ollama) is deployed separately and reached by URL (OLLAMA_URL / model connections).
# Settings come from .env (see .env.example); SECTION__FIELD variables override config.yaml values,
# e.g. CONTENT__SEED_STATUS=active for a demo (docs/DATABASE.md).
#
# Networks: `public` (proxy, api, worker) and `internal` (internal: true; db, api, worker). The database is on
# the internal network only, so it is not reachable from outside the stack; only the proxy publishes ports.

x-app: &app
  build:
    context: .
    dockerfile: backend/Dockerfile
    args:
      SPACY_MODEL: ${SPACY_MODEL:-en_core_web_lg}
  env_file:
    - path: .env
      required: false
  environment:
    # the db service; the password is passed as PGPASSWORD, never inside the URL
    DATABASE_URL: postgresql+psycopg://tutor@db:5432/tutor
    PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # instructor uploads inside the named volume, whatever .env says
    RAG__MATERIALS_DIR: /app/var/topics
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - tutor-data:/app/var
  networks: [public, internal]
  restart: unless-stopped

services:
  db:
    # PostgreSQL (task Z3). The password comes from POSTGRES_PASSWORD in .env; the data lives in db-data.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tutor
      POSTGRES_DB: tutor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutor -d tutor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    <<: *app

  worker:
    # background jobs (index rebuilds, instructor AI, evaluations, usage reset) and the live settings switch
    <<: *app
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy  # the api applies the database migrations first

  proxy:
    # Caddy: serves the frontend and forwards /api to the api service; HTTPS with a domain (deploy/Caddyfile)
    build:
      context: .
      dockerfile: deploy/proxy.Dockerfile
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-${WEB_PORT:-8080}}:80"  # WEB_PORT: the name used before Z8
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - caddy-data:/data  # certificates
    networks: [public]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---- monitoring (task Z13): `docker compose --profile monitoring up -d`; not started otherwise ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/monitoring/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    networks: [public]  # reaches api:8000 and the vLLM server; publishes no port
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    networks: [public]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    # refuses to start without GRAFANA_ADMIN_PASSWORD in .env (never the default admin password)
    entrypoint: ["sh", "-c", "test -n \"$$GF_SECURITY_ADMIN_PASSWORD\" || { echo 'set GRAFANA_ADMIN_PASSWORD in .env'; exit 1; }; exec /run.sh"]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"  # this host only: open it through an SSH tunnel
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [public]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  public: {}
  internal:
    internal: true

volumes:
  tutor-data:
  db-data:
  caddy-data:
  prometheus-data:
  grafana-data:
